<svg width="680" height="354" viewBox="0 0 680 354" xmlns="http://www.w3.org/2000/svg" role="img">
<title>gcpcloudhub.in landing zone architecture</title>
<desc>Organization contains five department folders, each connected to a shared VPC networking layer, which connects to workload projects.</desc>
