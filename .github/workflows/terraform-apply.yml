name: Terraform Apply

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  apply-bootstrap:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
      - name: Write terraform.tfvars
        working-directory: 00-bootstrap
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          DOMAIN: ${{ vars.GCP_DOMAIN }}
          GH_REPO_REF: ${{ vars.GH_REPO_REF }}
          BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
        run: |
          cat > terraform.tfvars << EOF
          org_id             = "$ORG_ID"
          billing_account_id = "$BILLING_ACCOUNT_ID"
          domain             = "$DOMAIN"
          prefix             = "$PREFIX"
          region             = "$REGION"
          github_repo        = "$GH_REPO_REF"
          EOF
      - working-directory: 00-bootstrap
        run: terraform init && terraform apply -auto-approve

  apply-org-policies:
    needs: apply-bootstrap
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
      - name: Write terraform.tfvars
        working-directory: 01-org-policies
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          CUSTOMER_ID: ${{ vars.GCP_CUSTOMER_ID }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          cat > terraform.tfvars << EOF
          org_id       = "$ORG_ID"
          customer_id  = "$CUSTOMER_ID"
          state_bucket = "$STATE_BUCKET"
          EOF
      - working-directory: 01-org-policies
        run: terraform init && terraform apply -auto-approve

  apply-resman:
    needs: apply-org-policies
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
      - name: Write terraform.tfvars
        working-directory: 02-resman
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          DOMAIN: ${{ vars.GCP_DOMAIN }}
        run: |
          cat > terraform.tfvars << EOF
          org_id      = "$ORG_ID"
          prefix      = "$PREFIX"
          departments = ["HR", "Finance", "IT", "Sales", "AI"]
          groups = {
            org_admins      = "gcp-organization-admins@$DOMAIN"
            billing_admins  = "gcp-billing-admins@$DOMAIN"
            devops          = "gcp-devops@$DOMAIN"
            security_admins = "gcp-security-admins@$DOMAIN"
          }
          EOF
      - working-directory: 02-resman
        run: terraform init && terraform apply -auto-approve

  apply-networking:
    needs: apply-resman
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
      - name: Write terraform.tfvars
        working-directory: 03-networking
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
        run: |
          cat > terraform.tfvars << EOF
          org_id             = "$ORG_ID"
          billing_account_id = "$BILLING_ACCOUNT_ID"
          prefix             = "$PREFIX"
          region             = "$REGION"
          state_bucket       = "$STATE_BUCKET"
          EOF
      - working-directory: 03-networking
        run: terraform init && terraform apply -auto-approve

  apply-project-factory:
    needs: apply-networking
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
      - name: Write terraform.tfvars
        working-directory: 04-project-factory
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
        run: |
          cat > terraform.tfvars << EOF
          org_id             = "$ORG_ID"
          billing_account_id = "$BILLING_ACCOUNT_ID"
          prefix             = "$PREFIX"
          departments        = ["HR", "Finance", "IT", "Sales", "AI"]
          state_bucket       = "$STATE_BUCKET"
          enabled_workloads = [
            { department = "HR",    env = "prod" },
            { department = "HR",    env = "nonprod" },
            { department = "Sales", env = "nonprod" },
          ]
          EOF
      - working-directory: 04-project-factory
        run: terraform init && terraform apply -auto-approve

  apply-security:
    needs: apply-project-factory
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
      - name: Write terraform.tfvars
        working-directory: 05-security
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          SEED_PROJECT_ID: ${{ vars.GCP_SEED_PROJECT_ID }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          cat > terraform.tfvars << EOF
          org_id          = "$ORG_ID"
          prefix          = "$PREFIX"
          seed_project_id = "$SEED_PROJECT_ID"
          state_bucket    = "$STATE_BUCKET"
          EOF
      - working-directory: 05-security
        run: terraform init && terraform apply -auto-approve
