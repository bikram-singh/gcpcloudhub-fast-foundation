name: Terraform Apply

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  apply-bootstrap:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
      - name: Write terraform.tfvars
        working-directory: 00-bootstrap
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          DOMAIN: ${{ vars.GCP_DOMAIN }}
          GH_REPO_REF: ${{ vars.GH_REPO_REF }}
          BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
        run: |
          cat > terraform.tfvars << EOF
          org_id             = "$ORG_ID"
          billing_account_id = "$BILLING_ACCOUNT_ID"
          domain             = "$DOMAIN"
          prefix             = "$PREFIX"
          region             = "$REGION"
          github_repo        = "$GH_REPO_REF"
          EOF
      - working-directory: 00-bootstrap
        run: terraform init && terraform apply -auto-approve

  apply-org-policies:
    needs: apply-bootstrap
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
      - name: Write terraform.tfvars
        working-directory: 01-org-policies
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          CUSTOMER_ID: ${{ vars.GCP_CUSTOMER_ID }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          cat > terraform.tfvars << EOF
          org_id       = "$ORG_ID"
          customer_id  = "$CUSTOMER_ID"
          state_bucket = "$STATE_BUCKET"
          EOF
      - working-directory: 01-org-policies
        run: terraform init && terraform apply -auto-approve

  apply-resman:
    needs: apply-org-policies
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
      - name: Write terraform.tfvars
        working-directory: 02-resman
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          DOMAIN: ${{ vars.GCP_DOMAIN }}
        run: |
          cat > terraform.tfvars << EOF
          org_id      = "$ORG_ID"
          prefix      = "$PREFIX"
          departments = ["HR", "Finance", "IT", "Sales", "AI"]
          groups = {
            org_admins      = "gcp-organization-admins@$DOMAIN"
            billing_admins  = "gcp-billing-admins@$DOMAIN"
            devops          = "gcp-devops@$DOMAIN"
            security_admins = "gcp-security-admins@$DOMAIN"
          }
          EOF
      - working-directory: 02-resman
        run: terraform init && terraform apply -auto-approve

  apply-networking:
    needs: apply-resman
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
      - name: Write terraform.tfvars
        working-directory: 03-networking
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
        run: |
          cat > terraform.tfvars << EOF
          org_id             = "$ORG_ID"
          billing_account_id = "$BILLING_ACCOUNT_ID"
          prefix             = "$PREFIX"
          region             = "$REGION"
          state_bucket       = "$STATE_BUCKET"
          EOF
      - working-directory: 03-networking
        run: terraform init && terraform apply -auto-approve

  apply-project-factory:
    needs: apply-networking
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
      - name: Write terraform.tfvars
        working-directory: 04-project-factory
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
        run: |
          cat > terraform.tfvars << EOF
          org_id             = "$ORG_ID"
          billing_account_id = "$BILLING_ACCOUNT_ID"
          prefix             = "$PREFIX"
          departments        = ["HR", "Finance", "IT", "Sales", "AI"]
          state_bucket       = "$STATE_BUCKET"
          enabled_workloads = [
            { department = "HR",    env = "prod" },
            { department = "HR",    env = "nonprod" },
            { department = "Sales", env = "nonprod" },
          ]
          EOF
      - working-directory: 04-project-factory
        run: terraform init && terraform apply -auto-approve

  apply-vpc-sc:
    needs: apply-project-factory
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
      - name: Write terraform.tfvars
        working-directory: 08-vpc-sc
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          cat > terraform.tfvars << TFEOF
          org_id       = "$ORG_ID"
          prefix       = "$PREFIX"
          state_bucket = "$STATE_BUCKET"
          TFEOF
      - working-directory: 08-vpc-sc
        run: terraform init && terraform apply -auto-approve

  apply-security:
    needs: apply-vpc-sc
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
      - name: Write terraform.tfvars
        working-directory: 05-security
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          SEED_PROJECT_ID: ${{ vars.GCP_SEED_PROJECT_ID }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          cat > terraform.tfvars << EOF
          org_id          = "$ORG_ID"
          prefix          = "$PREFIX"
          seed_project_id = "$SEED_PROJECT_ID"
          state_bucket    = "$STATE_BUCKET"
          EOF
      - working-directory: 05-security
        run: terraform init && terraform apply -auto-approve

  apply-workload-demo:
    needs: apply-security
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
      - name: Write terraform.tfvars
        working-directory: 06-workload-demo
        env:
          PREFIX: ${{ vars.GCP_PREFIX }}
          REGION: ${{ vars.GCP_REGION }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
        run: |
          cat > terraform.tfvars << TFEOF
          prefix       = "$PREFIX"
          region       = "$REGION"
          state_bucket = "$STATE_BUCKET"
          TFEOF
      - working-directory: 06-workload-demo
        run: terraform init && terraform apply -auto-approve

  apply-cost-visibility:
    needs: apply-workload-demo
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
      - name: Write terraform.tfvars
        working-directory: 07-cost-visibility
        env:
          PREFIX: ${{ vars.GCP_PREFIX }}
          REGION: ${{ vars.GCP_REGION }}
          SEED_PROJECT_ID: ${{ vars.GCP_SEED_PROJECT_ID }}
          BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
        run: |
          cat > terraform.tfvars << TFEOF
          prefix              = "$PREFIX"
          region              = "$REGION"
          seed_project_id     = "$SEED_PROJECT_ID"
          billing_account_id  = "$BILLING_ACCOUNT_ID"
          TFEOF
      - working-directory: 07-cost-visibility
        run: terraform init && terraform apply -auto-approve

  update-cost-badge:
    needs: apply-cost-visibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Generate cost estimate
        run: |
          infracost breakdown --path=. --format=json --out-file=/tmp/infracost.json || true
      - name: Extract monthly cost
        id: cost
        run: |
          COST=$(cat /tmp/infracost.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(f\"{float(d.get('totalMonthlyCost','0')):.2f}\")" 2>/dev/null || echo "0.00")
          echo "amount=$COST" >> "$GITHUB_OUTPUT"
      - name: Update cost badge gist
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 5e15a2c50f65a4436ed0b99c1e673ae7
          filename: gcpcloudhub-cost-badge.json
          label: infracost estimate
          message: $${{ steps.cost.outputs.amount }}
          color: green

  update-checkov-badge:
    needs: apply-cost-visibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install and run Checkov
        run: |
          pip install checkov --break-system-packages --quiet
          mkdir -p /tmp/checkov-out
          checkov -d . --compact --quiet \
            --skip-check CKV_GCP_62,CKV_GCP_125,CKV_GCP_45,CKV_GCP_38,CKV_GCP_81 \
            --output json --output-file-path /tmp/checkov-out || true
          ls -la /tmp/checkov-out/
      - name: Extract pass count
        id: count
        run: |
          PASSED=$(python3 -c "import json; d=json.load(open('/tmp/checkov-out/results_json.json')); print(next((i['summary']['passed'] for i in d if i.get('check_type')=='terraform'), '?'))" 2>/dev/null || echo "?")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
      - name: Update checkov badge gist
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 5e15a2c50f65a4436ed0b99c1e673ae7
          filename: gcpcloudhub-checkov-badge.json
          label: checkov scan
          message: ${{ steps.count.outputs.passed }} passed
          color: green

  update-billed-cost-badge:
    needs: apply-cost-visibility
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Query real billed cost
        id: cost
        run: |
          ROWS=$(bq query --use_legacy_sql=false --format=csv \
            "SELECT COUNT(*) FROM \`gch-seed-28bdf9.gch_billing_export.gcp_billing_export_resource_v1_012E9C_0D5AF1_5575CE\`" | tail -1)
          if [ "$ROWS" = "0" ]; then
            echo "amount=pending data" >> "$GITHUB_OUTPUT"
          else
            TOTAL_INR=$(bq query --use_legacy_sql=false --format=csv \
              "SELECT ROUND(SUM(cost), 2) FROM \`gch-seed-28bdf9.gch_billing_export.gcp_billing_export_resource_v1_012E9C_0D5AF1_5575CE\` WHERE usage_start_time >= TIMESTAMP_TRUNC(CURRENT_TIMESTAMP(), MONTH)" | tail -1)
            echo "--- Frankfurter API response ---"
            curl -s "https://api.frankfurter.app/latest?from=INR&to=USD"
            echo ""
            echo "--- end response ---"
            RATE=$(curl -s "https://api.frankfurter.app/latest?from=INR&to=USD" | python3 -c "import json,sys; print(json.load(sys.stdin).get('rates',{}).get('USD','0.012'))" 2>/dev/null || echo "0.012")
            TOTAL_USD=$(python3 -c "print(round($TOTAL_INR * $RATE, 2))")
            echo "amount=\$$TOTAL_USD" >> "$GITHUB_OUTPUT"
          fi
      - name: Update billed cost badge gist
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 5e15a2c50f65a4436ed0b99c1e673ae7
          filename: gcpcloudhub-billed-cost-badge.json
          label: gcp billed cost
          message: ${{ steps.cost.outputs.amount }}
          color: blue
