name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage:
          - 00-bootstrap
          - 01-org-policies
          - 02-resman
          - 03-networking
          - 04-project-factory
          - 05-security
          - 06-workload-demo
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97922325234/locations/global/workloadIdentityPools/gch-github-pool/providers/gch-github-provider
          service_account: gch-automation@gch-seed-28bdf9.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v4

      - name: Write terraform.tfvars
        working-directory: ${{ matrix.stage }}
        env:
          ORG_ID: ${{ vars.GCP_ORG_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PREFIX: ${{ vars.GCP_PREFIX }}
          CUSTOMER_ID: ${{ vars.GCP_CUSTOMER_ID }}
          DOMAIN: ${{ vars.GCP_DOMAIN }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          SEED_PROJECT_ID: ${{ vars.GCP_SEED_PROJECT_ID }}
          GH_REPO_REF: ${{ vars.GH_REPO_REF }}
          BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
        run: |
          case "${{ matrix.stage }}" in
            00-bootstrap)
              cat > terraform.tfvars << EOF
          org_id             = "$ORG_ID"
          billing_account_id = "$BILLING_ACCOUNT_ID"
          domain             = "$DOMAIN"
          prefix             = "$PREFIX"
          region             = "$REGION"
          github_repo        = "$GH_REPO_REF"
          EOF
              ;;
            01-org-policies)
              cat > terraform.tfvars << EOF
          org_id       = "$ORG_ID"
          customer_id  = "$CUSTOMER_ID"
          state_bucket = "$STATE_BUCKET"
          EOF
              ;;
            02-resman)
              cat > terraform.tfvars << EOF
          org_id      = "$ORG_ID"
          prefix      = "$PREFIX"
          departments = ["HR", "Finance", "IT", "Sales", "AI"]
          groups = {
            org_admins      = "gcp-organization-admins@$DOMAIN"
            billing_admins  = "gcp-billing-admins@$DOMAIN"
            devops          = "gcp-devops@$DOMAIN"
            security_admins = "gcp-security-admins@$DOMAIN"
          }
          EOF
              ;;
            03-networking)
              cat > terraform.tfvars << EOF
          org_id             = "$ORG_ID"
          billing_account_id = "$BILLING_ACCOUNT_ID"
          prefix             = "$PREFIX"
          region             = "$REGION"
          state_bucket       = "$STATE_BUCKET"
          EOF
              ;;
            04-project-factory)
              cat > terraform.tfvars << EOF
          org_id             = "$ORG_ID"
          billing_account_id = "$BILLING_ACCOUNT_ID"
          prefix             = "$PREFIX"
          departments        = ["HR", "Finance", "IT", "Sales", "AI"]
          state_bucket       = "$STATE_BUCKET"
          enabled_workloads = [
            { department = "HR",    env = "prod" },
            { department = "HR",    env = "nonprod" },
            { department = "Sales", env = "nonprod" },
          ]
          EOF
              ;;
            05-security)
              cat > terraform.tfvars << EOF
          org_id           = "$ORG_ID"
          prefix           = "$PREFIX"
          seed_project_id  = "$SEED_PROJECT_ID"
          state_bucket     = "$STATE_BUCKET"
          EOF
              ;;
            06-workload-demo)
              cat > terraform.tfvars << EOF
          prefix       = "$PREFIX"
          region       = "$REGION"
          state_bucket = "$STATE_BUCKET"
          EOF
              ;;
          esac

      - name: Terraform Init
        working-directory: ${{ matrix.stage }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ matrix.stage }}
        run: terraform plan -no-color

  infracost:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v7
      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Generate cost estimate
        run: |
          infracost breakdown --path=. \
            --format=json \
            --out-file=/tmp/infracost.json || true
      - name: Post cost comment
        uses: infracost/actions/comment@v1
        with:
          path: /tmp/infracost.json
          behavior: update

  checkov-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          skip_check: CKV_GCP_62,CKV_GCP_125,CKV_GCP_45,CKV_GCP_38,CKV_GCP_81
          soft_fail: true
          output_format: cli
          output_file_path: console,/tmp/checkov-output.txt
      - name: Post Checkov comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = "Checkov scan completed.";
            try {
              output = fs.readFileSync('/tmp/checkov-output.txt', 'utf8').slice(-3000);
            } catch (e) {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Checkov scan results\n\`\`\`\n${output}\n\`\`\``
            });
